<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CERCO - Escolha seu Personagem</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="login-wrapper">
      <section class="login-card">
        <header class="login-header">
          <h1>Sistema <span class="brand-highlight">CERCO</span></h1>
          <p>Digite seu nickname e escolha seu personagem para começar</p>
        </header>

        <form class="login-form">
          <div class="linha-form">
            <label for="nickname">Nickname</label>
            <input type="text" id="nickname" name="nickname" placeholder="Digite seu nickname" required autocomplete="off" />
          </div>

          <!-- Lista de personagens disponíveis. Cada card representa um personagem -->
          <div class="linha-form">
            <label>Personagem</label>
            <div class="char-grid" id="charGrid">

              <div class="char-card" data-char="kael">
                <div class="char-avatar" style="background-image: url('zkael.png');"></div>
                <div class="char-name">Kael</div>
                <div class="char-stats">Vida: 200-300<br />Dano: 25-50</div>
              </div>

              <div class="char-card" data-char="lyra">
                <div class="char-avatar">L</div>
                <div class="char-name">Lyra</div>
                <div class="char-stats">Vida: 200-250<br />Dano: 30-50</div>
              </div>

              <div class="char-card" data-char="armstrong">
                <div class="char-avatar">A</div>
                <div class="char-name">Armstrong</div>
                <div class="char-stats">Vida: 220-350<br />Dano: 27-70</div>
              </div>

            </div>
          </div>

          <button onclick="onLogin(event)" id="btnEntrar" class="btn-submit">Iniciar Batalha</button>
        </form>
      </section>
    </main>
    <script src="login.js"></script> <!-- script no final do body para carregar o html primeiro -->
  </body>
</html>
